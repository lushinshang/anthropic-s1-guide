<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">毛利之後，還有研發與通路等費用</title><desc id="desc">同一總費用可按性質或功能分類，全部算力不等於營收成本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#265d50"/></marker></defs><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="1600" height="900" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">毛利之後，還有研發與通路等費用</text><text x="50" y="135" font-size="28" fill="#56645d" font-weight="400" text-anchor="start">本文計算｜2026 上半年；金額：億美元</text><rect x="40" y="230" width="280" height="210" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="65" y="279" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">收入</text><text x="65" y="329" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">162.86 億</text><path d="M323,335 L345,335" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="352" y="230" width="280" height="210" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="377" y="279" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">扣除營收成本</text><text x="377" y="329" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">23.80 億</text><path d="M635,335 L657,335" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="664" y="230" width="280" height="210" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="689" y="279" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">推算毛利</text><text x="689" y="329" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">139.06 億</text><text x="689" y="374" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">毛利率 85.4%</text><path d="M947,335 L969,335" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="976" y="230" width="280" height="210" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="1001" y="279" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">繼續扣除</text><text x="1001" y="329" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">研發</text><text x="1001" y="374" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">銷售、行政</text><path d="M1259,335 L1281,335" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="1288" y="230" width="280" height="210" rx="18" fill="#fffdf9" stroke="#b65035" stroke-width="2"/><text x="1313" y="279" font-size="36" fill="#b65035" font-weight="700" text-anchor="start">營業損益</text><text x="1313" y="329" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">−6.93 億</text><rect x="70" y="535" width="1460" height="210" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="95" y="584" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">兩種分類，不能混加</text><text x="95" y="634" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">性質別：全部算力 89.45 億，可用在付費服務、研發與內部工作等。</text><text x="95" y="679" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">功能別：研發 97.41 億＋銷售行銷 38.08 億＋行政 10.50 億，另扣於毛利後。</text><text x="60" y="860" font-size="26" fill="#56645d" font-weight="400" text-anchor="start">來源：S-1 F-7、F-39；毛利率為本文計算，非主表直接列示。</text></g></svg>