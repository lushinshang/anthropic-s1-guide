<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">三筆算力長約，付款期間重疊到 2033 年</title><desc id="desc">Microsoft、Google、Amazon 的最低付款期間與額外 TPU 估計交付期間在時間軸上的位置，各列金額不可相加。</desc><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="1600" height="900" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">三筆算力長約，付款期間重疊到 2033 年</text><text x="50" y="128" font-size="26" fill="#56645d" font-weight="400" text-anchor="start">本文依 S-1 MD&amp;A 整理｜金額：億美元；各列條件不同，不可相加</text><line x1="300.0" y1="190" x2="300.0" y2="770" stroke="#e4dfd6" stroke-width="2"/><text x="300.0" y="176" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2026</text><line x1="410.9" y1="190" x2="410.9" y2="770" stroke="#e4dfd6" stroke-width="2"/><line x1="521.8" y1="190" x2="521.8" y2="770" stroke="#e4dfd6" stroke-width="2"/><text x="521.8181818181818" y="176" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2028</text><line x1="632.7" y1="190" x2="632.7" y2="770" stroke="#e4dfd6" stroke-width="2"/><line x1="743.6" y1="190" x2="743.6" y2="770" stroke="#e4dfd6" stroke-width="2"/><text x="743.6363636363636" y="176" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2030</text><line x1="854.5" y1="190" x2="854.5" y2="770" stroke="#e4dfd6" stroke-width="2"/><line x1="965.5" y1="190" x2="965.5" y2="770" stroke="#e4dfd6" stroke-width="2"/><text x="965.4545454545455" y="176" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2032</text><line x1="1076.4" y1="190" x2="1076.4" y2="770" stroke="#e4dfd6" stroke-width="2"/><line x1="1187.3" y1="190" x2="1187.3" y2="770" stroke="#e4dfd6" stroke-width="2"/><text x="1187.2727272727273" y="176" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2034</text><line x1="1298.2" y1="190" x2="1298.2" y2="770" stroke="#e4dfd6" stroke-width="2"/><line x1="1409.1" y1="190" x2="1409.1" y2="770" stroke="#e4dfd6" stroke-width="2"/><text x="1409.090909090909" y="176" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2036</text><line x1="1520.0" y1="190" x2="1520.0" y2="770" stroke="#e4dfd6" stroke-width="2"/><text x="1520.0" y="176" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2037</text><rect x="392.4" y="190" width="730.2" height="375" fill="#265d50" opacity="0.07"/><text x="50" y="254" font-size="32" fill="#252b29" font-weight="700" text-anchor="start">Microsoft</text><text x="50" y="292" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">2026/11–2033/5</text><rect x="392.4" y="220" width="730.2" height="64" rx="8" fill="#265d50"/><text x="410.42424242424244" y="263" font-size="30" fill="#f8f5ee" font-weight="700" text-anchor="start">至少 449 億</text><text x="50" y="379" font-size="32" fill="#252b29" font-weight="700" text-anchor="start">Google</text><text x="50" y="417" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">2026/4–2033/7</text><rect x="327.7" y="345" width="813.3" height="64" rx="8" fill="#265d50"/><text x="345.72727272727275" y="388" font-size="30" fill="#f8f5ee" font-weight="700" text-anchor="start">至少約 1,145 億</text><text x="50" y="504" font-size="32" fill="#252b29" font-weight="700" text-anchor="start">Amazon</text><text x="50" y="542" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">2026/5–2036/4</text><rect x="337.0" y="470" width="1109.1" height="64" rx="8" fill="#265d50"/><text x="354.969696969697" y="513" font-size="30" fill="#f8f5ee" font-weight="700" text-anchor="start">至少 1,100 億</text><text x="50" y="704" font-size="32" fill="#252b29" font-weight="700" text-anchor="start">額外 TPU</text><text x="50" y="742" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">2028–2031 交付</text><rect x="521.8" y="670" width="443.6" height="64" rx="8" fill="#fffdf9" stroke="#265d50" stroke-width="3" stroke-dasharray="10 8"/><text x="539.8181818181818" y="713" font-size="30" fill="#265d50" font-weight="700" text-anchor="start">估計 1,250–1,500 億</text><text x="402.42424242424244" y="621" font-size="24" fill="#265d50" font-weight="700" text-anchor="start">▲ 前三筆同時付款：2026/11–2033/5</text><text x="50" y="815" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">虛線＝估計值（部署、容量與定價等條件而定），與固定最低承諾性質不同。</text><text x="50" y="860" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">來源：S-1 MD&amp;A 頁 170–171。也不能再加到 6 月底附註 13 的約 2,656 億美元上。</text></g></svg>