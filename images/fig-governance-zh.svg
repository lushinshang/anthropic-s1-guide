<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">誰有經濟利益，誰選董事，誰能表決</title><desc id="desc">A和N的經濟權利，與T董事選任和F一般股東表決權分開，另有E股制衡和修改程序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#265d50"/></marker></defs><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="1600" height="900" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">誰有經濟利益，誰選董事，誰能表決</text><text x="50" y="135" font-size="28" fill="#56645d" font-weight="400" text-anchor="start">本文整理｜預期 IPO 後；經濟權利與表決權分開</text><rect x="55" y="190" width="710" height="190" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="80" y="239" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">LTBT 持 T 股</text><text x="80" y="289" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">一般選任 T 董事 4／7 席</text><text x="80" y="334" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">初始含 1 空缺；特定一席另有程序</text><rect x="835" y="190" width="710" height="190" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="860" y="239" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">Founder LLC 持一股 F</text><text x="860" y="289" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">一般股東事項合計 50.1% 票權</text><text x="860" y="334" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">A＋F 選任其餘 3 席</text><path d="M410,388 L690,455" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><path d="M1190,388 L910,455" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="440" y="465" width="720" height="155" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="465" y="514" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">董事會 → 管理層</text><text x="465" y="564" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">實際公司業務決策；LTBT 不負責日常經營</text><rect x="55" y="665" width="710" height="150" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="80" y="714" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">員工 E 股</text><text x="80" y="764" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">特定 T 席及部分信託變更等有限事項</text><rect x="835" y="665" width="710" height="150" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="860" y="714" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">A／N 股具有經濟權利</text><text x="860" y="764" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">A 每股一票；N 原則無一般表決權</text><text x="50" y="860" font-size="26" fill="#56645d" font-weight="400" text-anchor="start">特定 T 席有 NGC／E 股程序；公益基金持 N，並非 LTBT。來源：S-1 治理章。</text></g></svg>