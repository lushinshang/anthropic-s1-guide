<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="title desc"><title id="title">毛利之後，還有研發與通路等費用</title><desc id="desc">同一總費用可按性質或功能分類，全部算力不等於營收成本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#265d50"/></marker></defs><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="900" height="1600" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">毛利之後，還有研發與通路等費用</text><text x="50" y="135" font-size="28" fill="#56645d" font-weight="400" text-anchor="start">本文計算｜2026 上半年；金額：億美元</text><rect x="80" y="190" width="740" height="180" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="105" y="239" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">收入</text><text x="105" y="289" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">162.86 億</text><path d="M450,360 L450,412" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="425" width="740" height="180" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="105" y="474" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">扣除營收成本</text><text x="105" y="524" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">23.80 億</text><path d="M450,595 L450,647" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="660" width="740" height="180" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="105" y="709" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">推算毛利</text><text x="105" y="759" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">139.06 億</text><text x="105" y="804" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">毛利率 85.4%</text><path d="M450,830 L450,882" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="895" width="740" height="180" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="105" y="944" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">繼續扣除</text><text x="105" y="994" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">研發、銷售、行政</text><path d="M450,1065 L450,1117" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="1130" width="740" height="180" rx="18" fill="#fffdf9" stroke="#b65035" stroke-width="2"/><text x="105" y="1179" font-size="36" fill="#b65035" font-weight="700" text-anchor="start">營業損益</text><text x="105" y="1229" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">−6.93 億</text><text x="60" y="1435" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">全部算力 89.45 億包含不同功能用途。</text><text x="60" y="1485" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">不可再把它全數當成營收成本扣一次。</text><text x="60" y="1550" font-size="25" fill="#56645d" font-weight="400" text-anchor="start">來源：S-1 F-7、F-39；毛利率為本文計算。</text></g></svg>