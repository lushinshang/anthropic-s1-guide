<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc"><title id="title">企業客戶群快速成長</title><desc id="desc">近12個月收入貢獻至少10萬美元的組織客戶，2023年底約20家、2024年底約200家、2025年底約1500家、2026年9月底超過11900家。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#265d50"/></marker></defs><rect width="900" height="1600" rx="28" fill="#f8f5ee"/><text x="52" y="83" font-size="42" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">企業客戶群快速成長</text><text x="52" y="137" font-size="28" font-weight="400" fill="#56645d" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">近12個月收入貢獻至少10萬美元的組織客戶</text><text x="62" y="240" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2023-12-31</text><text x="62" y="302" font-size="46" font-weight="700" fill="#c96041" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">約20家</text><rect x="62" y="335" width="760" height="80" rx="8" fill="#e6e7df" stroke="#e6e7df" stroke-width="2"/><rect x="62" y="335" width="8" height="80" rx="8" fill="#c96041" stroke="#c96041" stroke-width="2"/><text x="62" y="525" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2024-12-31</text><text x="62" y="587" font-size="46" font-weight="700" fill="#c96041" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">約200家</text><rect x="62" y="620" width="760" height="80" rx="8" fill="#e6e7df" stroke="#e6e7df" stroke-width="2"/><rect x="62" y="620" width="12.773109243697478" height="80" rx="8" fill="#c96041" stroke="#c96041" stroke-width="2"/><text x="62" y="810" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2025-12-31</text><text x="62" y="872" font-size="46" font-weight="700" fill="#c96041" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">約1,500家</text><rect x="62" y="905" width="760" height="80" rx="8" fill="#e6e7df" stroke="#e6e7df" stroke-width="2"/><rect x="62" y="905" width="95.7983193277311" height="80" rx="8" fill="#c96041" stroke="#c96041" stroke-width="2"/><text x="62" y="1095" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2026-09-30</text><text x="62" y="1157" font-size="46" font-weight="700" fill="#c96041" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">超過11,900家</text><rect x="62" y="1190" width="760" height="80" rx="8" fill="#e6e7df" stroke="#e6e7df" stroke-width="2"/><rect x="62" y="1190" width="760.0" height="80" rx="8" fill="#c96041" stroke="#c96041" stroke-width="2"/><text x="62" y="1440" font-size="30" font-weight="400" fill="#56645d" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">門檻指實際收入貢獻；不是合約總額。</text><text x="52" y="1557" font-size="27" font-weight="400" fill="#56645d" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">來源：S-1 mda2aa.jpg｜截至各標示日期</text></svg>