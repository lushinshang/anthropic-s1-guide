<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">NRR 約 900%，不代表每家客戶都留下</title><desc id="desc">以五家假設客戶示意：合計由 100 變 900，但一家流失、一家縮減，成長幾乎來自客戶 E。</desc><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="1600" height="900" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">NRR 約 900%，不代表每家客戶都留下</text><text x="50" y="128" font-size="26" fill="#b65035" font-weight="700" text-anchor="start">示意圖：五家假設客戶，數字非 S-1 資料</text><rect x="900" y="108" width="28" height="20" rx="4" fill="#a9a397"/><text x="940" y="128" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">一年前同季</text><rect x="1130" y="108" width="28" height="20" rx="4" fill="#265d50"/><text x="1170" y="128" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">現在（同一批客戶）</text><text x="50" y="267" font-size="30" fill="#252b29" font-weight="700" text-anchor="start">客戶 A</text><rect x="250" y="223" width="23.3" height="28" rx="5" fill="#a9a397"/><text x="287.3333333333333" y="246" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="250" y="257" width="7" height="28" rx="3" fill="#b65035"/><text x="272" y="281" font-size="26" fill="#b65035" font-weight="700" text-anchor="start">0　流失</text><text x="50" y="363" font-size="30" fill="#252b29" font-weight="700" text-anchor="start">客戶 B</text><rect x="250" y="319" width="23.3" height="28" rx="5" fill="#a9a397"/><text x="287.3333333333333" y="342" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="250" y="353" width="11.7" height="28" rx="5" fill="#56645d"/><text x="275.6666666666667" y="377" font-size="26" fill="#56645d" font-weight="700" text-anchor="start">10　縮減</text><text x="50" y="459" font-size="30" fill="#252b29" font-weight="700" text-anchor="start">客戶 C</text><rect x="250" y="415" width="23.3" height="28" rx="5" fill="#a9a397"/><text x="287.3333333333333" y="438" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="250" y="449" width="23.3" height="28" rx="5" fill="#56645d"/><text x="287.3333333333333" y="473" font-size="26" fill="#56645d" font-weight="700" text-anchor="start">20　持平</text><text x="50" y="555" font-size="30" fill="#252b29" font-weight="700" text-anchor="start">客戶 D</text><rect x="250" y="511" width="23.3" height="28" rx="5" fill="#a9a397"/><text x="287.3333333333333" y="534" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="250" y="545" width="35.0" height="28" rx="5" fill="#265d50"/><text x="299.0" y="569" font-size="26" fill="#265d50" font-weight="700" text-anchor="start">30　小幅增購</text><text x="50" y="651" font-size="30" fill="#252b29" font-weight="700" text-anchor="start">客戶 E</text><rect x="250" y="607" width="23.3" height="28" rx="5" fill="#a9a397"/><text x="287.3333333333333" y="630" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="250" y="641" width="980.0" height="28" rx="5" fill="#265d50"/><text x="1214.0" y="664" font-size="26" fill="#f8f5ee" font-weight="700" text-anchor="end">840　大幅擴張</text><line x1="50" y1="709" x2="1540" y2="709" stroke="#e4dfd6" stroke-width="2"/><text x="50" y="759" font-size="34" fill="#252b29" font-weight="700" text-anchor="start">合計 100 → 900　NRR = 900 ÷ 100 = 900%</text><text x="50" y="801" font-size="28" fill="#b65035" font-weight="700" text-anchor="start">但五家有一家流失、一家縮減；成長幾乎全來自客戶 E。</text><text x="50" y="860" font-size="22" fill="#56645d" font-weight="400" text-anchor="start">定義依 S-1：合格客戶當期三個月收入 ÷ 一年前同季收入；排除 Claude Pro、Max 固定價格訂閱者，新客戶不計入。</text></g></svg>