<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">需求與多年付款，可能走不同速度</title><desc id="desc">當收入變動但多年最低付款未同步縮減，可能造成流動性壓力，並非必然違約。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#265d50"/></marker></defs><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="1600" height="900" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">需求與多年付款，可能走不同速度</text><text x="50" y="135" font-size="29" fill="#56645d" font-weight="400" text-anchor="start">本文分析｜條件式風險路徑；不是必然預測</text><rect x="70" y="210" width="680" height="220" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="95" y="259" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">需求或價格變動</text><text x="95" y="309" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">用量下降、模型降價或客戶轉移</text><rect x="855" y="210" width="680" height="220" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="880" y="259" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">收入或收款承壓</text><text x="880" y="309" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">影響幅度仍受客群與通路條款左右</text><rect x="70" y="560" width="680" height="220" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="95" y="609" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">多年付款未必同步縮減</text><text x="95" y="659" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">最低採購、租賃及部分部署付款仍可能存在</text><rect x="855" y="560" width="680" height="220" rx="18" fill="#fffdf9" stroke="#b65035" stroke-width="2"/><text x="880" y="609" font-size="36" fill="#b65035" font-weight="700" text-anchor="start">可能形成流動性壓力</text><text x="880" y="659" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">需看現金、到期結構、融資與調整能力</text><path d="M755,320 L842,320" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><path d="M1190,440 L1190,500 L410,500 L410,545" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><path d="M755,670 L842,670" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><text x="55" y="850" font-size="28" fill="#56645d" font-weight="400" text-anchor="start">公司也可能透過調整部署、商務協商與融資因應；須依個別合約判讀。</text></g></svg>