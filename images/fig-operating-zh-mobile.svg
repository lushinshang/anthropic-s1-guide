<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc"><title id="title">調整後營業利益率改善</title><desc id="desc">非GAAP調整後營業利益率由2025Q1的負221%改善為2026Q2的19%，提高240個百分點，須另看GAAP營業損益及淨損。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#265d50"/></marker></defs><rect width="900" height="1600" rx="28" fill="#f8f5ee"/><text x="52" y="83" font-size="42" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">調整後營業利益率改善</text><text x="52" y="137" font-size="28" font-weight="400" fill="#56645d" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">非GAAP指標｜2025Q1至2026Q2提高240個百分點</text><text x="62" y="295" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2025Q1</text><text x="810" y="295" font-size="46" font-weight="700" fill="#c96041" text-anchor="end" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">-221%</text><line x1="62" y1="340" x2="810" y2="340" stroke="#d9ded6" stroke-width="3"/><text x="62" y="463" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2025Q2</text><text x="810" y="463" font-size="46" font-weight="700" fill="#c96041" text-anchor="end" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">-129%</text><line x1="62" y1="508" x2="810" y2="508" stroke="#d9ded6" stroke-width="3"/><text x="62" y="631" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2025Q3</text><text x="810" y="631" font-size="46" font-weight="700" fill="#c96041" text-anchor="end" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">-93%</text><line x1="62" y1="676" x2="810" y2="676" stroke="#d9ded6" stroke-width="3"/><text x="62" y="799" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2025Q4</text><text x="810" y="799" font-size="46" font-weight="700" fill="#c96041" text-anchor="end" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">-84%</text><line x1="62" y1="844" x2="810" y2="844" stroke="#d9ded6" stroke-width="3"/><text x="62" y="967" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2026Q1</text><text x="810" y="967" font-size="46" font-weight="700" fill="#c96041" text-anchor="end" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">-13%</text><line x1="62" y1="1012" x2="810" y2="1012" stroke="#d9ded6" stroke-width="3"/><text x="62" y="1135" font-size="36" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">2026Q2</text><text x="810" y="1135" font-size="46" font-weight="700" fill="#265d50" text-anchor="end" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">19%</text><line x1="62" y1="1180" x2="810" y2="1180" stroke="#d9ded6" stroke-width="3"/><rect x="52" y="1325" width="795" height="135" rx="18" fill="#e4ece6" stroke="#d9ded6" stroke-width="2"/><text x="450" y="1368" font-size="44" font-weight="700" fill="#252b29" text-anchor="middle" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">−221% → 19%</text><text x="450" y="1440" font-size="36" font-weight="700" fill="#252b29" text-anchor="middle" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">提高240個百分點</text><text x="52" y="1557" font-size="27" font-weight="400" fill="#56645d" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">來源：S-1 mda4aa.jpg