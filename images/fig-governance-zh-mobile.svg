<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="title desc"><title id="title">誰有經濟利益，誰選董事，誰能表決</title><desc id="desc">A和N的經濟權利，與T董事選任和F一般股東表決權分開，另有E股制衡和修改程序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#265d50"/></marker></defs><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="900" height="1600" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">誰有經濟利益，誰選董事，誰能表決</text><text x="50" y="135" font-size="28" fill="#56645d" font-weight="400" text-anchor="start">本文整理｜預期 IPO 後；經濟權利與表決權分開</text><rect x="55" y="190" width="790" height="200" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="80" y="239" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">LTBT 持 T 股</text><text x="80" y="289" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">一般選任 T 董事 4／7 席</text><text x="80" y="334" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">初始含 1 空缺；特定一席另有程序</text><path d="M450,398 L450,440" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="55" y="455" width="790" height="200" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="80" y="504" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">董事會 → 管理層</text><text x="80" y="554" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">董事會與管理層負責公司業務決策</text><text x="80" y="599" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">LTBT 不負責日常經營</text><rect x="55" y="705" width="790" height="200" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="80" y="754" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">Founder LLC 持一股 F</text><text x="80" y="804" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">一般股東事項合計 50.1% 票權</text><text x="80" y="849" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">A＋F 選任其餘 3 席；仍受董事會程序約束</text><rect x="55" y="955" width="790" height="200" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="80" y="1004" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">員工 E 股：有限事項參與</text><text x="80" y="1054" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">不含共同創辦人；特定 T 席及信託變更等</text><text x="80" y="1099" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">T／F／E 無經濟權利，清算面額另有條款</text><rect x="55" y="1205" width="790" height="200" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="80" y="1254" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">A／N 股：經濟權利</text><text x="80" y="1304" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">A 每股一票；N 原則無一般表決權</text><text x="80" y="1349" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">公益基金持 N 股，與 LTBT 是不同安排</text><text x="50" y="1500" font-size="29" fill="#252b29" font-weight="400" text-anchor="start">特定 T 席：NGC 同意，或 E 股表決路徑。</text><text x="50" y="1550" font-size="25" fill="#56645d" font-weight="400" text-anchor="start">來源：S-1，頁 242–253、257、292 起。</text></g></svg>