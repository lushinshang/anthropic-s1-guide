<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">807.48 億美元淨損，營業虧損只占不到 1%</title><desc id="desc">2026 上半年由營業損益 −6.93 億，經公允價值變動等非營業項目，到 GAAP 淨損 −807.48 億的橋接圖。</desc><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="1600" height="900" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">807.48 億美元淨損，營業虧損只占不到 1%</text><text x="50" y="128" font-size="26" fill="#56645d" font-weight="400" text-anchor="start">本文依 S-1 整理｜2026 上半年；金額：億美元；0 為營業損益起點</text><line x1="70" y1="240" x2="1540" y2="240" stroke="#56645d" stroke-width="2"/><text x="70" y="226" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">0</text><rect x="100" y="240.0" width="230" height="7.0" rx="6" fill="#b65035"/><text x="215.0" y="279.2192760479701" font-size="32" fill="#b65035" font-weight="700" text-anchor="middle">−6.93 億</text><line x1="330" y1="243.2" x2="390" y2="243.2" stroke="#56645d" stroke-width="2" stroke-dasharray="6 6"/><rect x="390" y="243.2" width="230" height="336.3" rx="6" fill="#b65035"/><text x="505.0" y="615.4919377513722" font-size="32" fill="#b65035" font-weight="700" text-anchor="middle">−723.88 億</text><line x1="620" y1="579.5" x2="680" y2="579.5" stroke="#56645d" stroke-width="2" stroke-dasharray="6 6"/><rect x="680" y="579.5" width="230" height="40.5" rx="6" fill="#b65035"/><text x="795.0" y="656.0" font-size="32" fill="#b65035" font-weight="700" text-anchor="middle">−87.20 億</text><line x1="910" y1="620.0" x2="970" y2="620.0" stroke="#56645d" stroke-width="2" stroke-dasharray="6 6"/><rect x="970" y="615.1" width="230" height="7.0" rx="6" fill="#265d50"/><text x="1085.0" y="601.1083727582793" font-size="32" fill="#265d50" font-weight="700" text-anchor="middle">＋10.53 億</text><line x1="1200" y1="615.1" x2="1260" y2="615.1" stroke="#56645d" stroke-width="2" stroke-dasharray="6 6"/><rect x="1260" y="240.0" width="230" height="375.1" rx="6" fill="#252b29"/><text x="1375.0" y="300" font-size="32" fill="#f8f5ee" font-weight="700" text-anchor="middle">−807.48 億</text><text x="215.0" y="722" font-size="26" fill="#252b29" font-weight="700" text-anchor="middle">營業損益</text><text x="505.0" y="722" font-size="26" fill="#252b29" font-weight="700" text-anchor="middle">可轉債、衍生負債、</text><text x="505.0" y="756" font-size="26" fill="#252b29" font-weight="700" text-anchor="middle">SAFE 公允價值變動</text><text x="795.0" y="722" font-size="26" fill="#252b29" font-weight="700" text-anchor="middle">其他特定金融工具</text><text x="795.0" y="756" font-size="26" fill="#252b29" font-weight="700" text-anchor="middle">公允價值調整</text><text x="1085.0" y="722" font-size="26" fill="#252b29" font-weight="700" text-anchor="middle">利息、稅與其他</text><text x="1085.0" y="756" font-size="26" fill="#252b29" font-weight="700" text-anchor="middle">（本文推算差額）</text><text x="1375.0" y="722" font-size="26" fill="#252b29" font-weight="700" text-anchor="middle">GAAP 淨損</text><text x="505.0" y="800" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">會計重新衡量，非同額現金支出</text><text x="225.0" y="200" font-size="20" fill="#252b29" font-weight="400" text-anchor="start"></text><text x="60" y="860" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">來源：S-1 損益表 F-7、非 GAAP 調節頁 157；「利息、稅與其他」為本文以淨損扣除前三項推算。營業現金流 ＋39.29 億不在此圖內。</text></g></svg>