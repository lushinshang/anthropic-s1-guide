<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">從單次回答到持續協作</title><desc id="desc">聊天機器人提供單次回答，副駕駛在單一應用工作，虛擬協作者接收目標持續執行，具判斷、自我修正及工具存取能力；月結畫面數字屬概念示例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#265d50"/></marker></defs><rect width="1600" height="900" rx="28" fill="#f8f5ee"/><text x="52" y="83" font-size="46" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">從單次回答到持續協作</text><text x="52" y="137" font-size="30" font-weight="400" fill="#56645d" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">原圖翻譯重製｜示例畫面不屬客戶績效數據</text><rect x="65" y="240" width="470" height="345" rx="18" fill="#e6ece5" stroke="#d9ded6" stroke-width="2"/><text x="95" y="310" font-size="39" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">聊天機器人</text><text x="95" y="378" font-size="29" font-weight="400" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">範圍較窄、單次回答</text><text x="95" y="426" font-size="29" font-weight="400" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">「重設我的密碼」</text><text x="95" y="474" font-size="29" font-weight="400" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">→ 提供操作說明</text><line x1="537" y1="410" x2="575" y2="410" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="580" y="240" width="470" height="345" rx="18" fill="#e6ece5" stroke="#d9ded6" stroke-width="2"/><text x="610" y="310" font-size="39" font-weight="700" fill="#252b29" text-anchor="start" font-family="PingFang TC,Noto Sans TC,Microsoft JhengH