<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="title desc"><title id="title">807.48 億美元淨損，營業虧損只占不到 1%</title><desc id="desc">2026 上半年由營業損益 −6.93 億，經公允價值變動等非營業項目，到 GAAP 淨損 −807.48 億的橋接圖。</desc><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="900" height="1600" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">807.48 億美元淨損，</text><text x="50" y="134" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">營業虧損只占不到 1%</text><text x="50" y="186" font-size="26" fill="#56645d" font-weight="400" text-anchor="start">本文依 S-1 整理｜2026 上半年；金額：億美元</text><text x="50" y="258" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">營業損益</text><rect x="90.0" y="280" width="7.0" height="64" rx="6" fill="#b65035"/><line x1="90" y1="272" x2="90" y2="352" stroke="#56645d" stroke-width="2"/><text x="110.09968093299592" y="326" font-size="32" fill="#b65035" font-weight="700" text-anchor="start">−6.93 億</text><text x="50" y="488" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">可轉債、衍生負債、SAFE 公允價值變動</text><rect x="96.1" y="510" width="637.1" height="64" rx="6" fill="#b65035"/><line x1="90" y1="502" x2="90" y2="582" stroke="#56645d" stroke-width="2"/><text x="717.2478820552317" y="556" font-size="32" fill="#f8f5ee" font-weight="700" text-anchor="end">−723.88 億</text><text x="50" y="615" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">會計重新衡量，非同額現金支出</text><text x="50" y="718" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">其他特定金融工具公允價值調整</text><rect x="733.2" y="740" width="76.8" height="64" rx="6" fill="#b65035"/><line x1="90" y1="732" x2="90" y2="812" stroke="#56645d" stroke-width="2"/><text x="719.2478820552317" y="786" font-size="32" fill="#b65035" font-weight="700" text-anchor="end">−87.20 億</text><text x="50" y="948" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">利息、稅與其他（本文推算差額）</text><rect x="800.7" y="970" width="9.3" height="64" rx="6" fill="#265d50"/><line x1="90" y1="962" x2="90" y2="1042" stroke="#56645d" stroke-width="2"/><text x="786.731653647266" y="1016" font-size="32" fill="#265d50" font-weight="700" text-anchor="end">＋10.53 億</text><text x="50" y="1178" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">GAAP 淨損</text><rect x="90.0" y="1200" width="710.7" height="64" rx="6" fill="#252b29"/><line x1="90" y1="1192" x2="90" y2="1272" stroke="#56645d" stroke-width="2"/><text x="784.731653647266" y="1246" font-size="32" fill="#f8f5ee" font-weight="700" text-anchor="end">−807.48 億</text><text x="50" y="1470" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">來源：S-1 損益表 F-7、非 GAAP 調節頁 157；</text><text x="50" y="1504" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">「利息、稅與其他」為本文以淨損扣除前三項推算。</text><text x="50" y="1538" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">營業現金流 ＋39.29 億不在此圖內。</text></g></svg>