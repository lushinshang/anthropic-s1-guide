<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="title desc"><title id="title">NRR 約 900%，不代表每家客戶都留下</title><desc id="desc">以五家假設客戶示意：合計由 100 變 900，但一家流失、一家縮減，成長幾乎來自客戶 E。</desc><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="900" height="1600" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">NRR 約 900%，</text><text x="50" y="134" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">不代表每家客戶都留下</text><text x="50" y="186" font-size="26" fill="#b65035" font-weight="700" text-anchor="start">示意圖：五家假設客戶，數字非 S-1 資料</text><rect x="50" y="226" width="28" height="20" rx="4" fill="#a9a397"/><text x="90" y="246" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">一年前同季</text><rect x="280" y="226" width="28" height="20" rx="4" fill="#265d50"/><text x="320" y="246" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">現在（同一批客戶）</text><text x="50" y="330" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">客戶 A　流失</text><rect x="60" y="346" width="18.6" height="28" rx="5" fill="#a9a397"/><text x="92.57142857142857" y="369" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="60" y="384" width="7" height="28" rx="3" fill="#b65035"/><text x="82" y="408" font-size="26" fill="#b65035" font-weight="700" text-anchor="start">0（流失）</text><text x="50" y="500" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">客戶 B　縮減</text><rect x="60" y="516" width="18.6" height="28" rx="5" fill="#a9a397"/><text x="92.57142857142857" y="539" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="60" y="554" width="9.3" height="28" rx="5" fill="#56645d"/><text x="83.28571428571429" y="578" font-size="26" fill="#56645d" font-weight="700" text-anchor="start">10</text><text x="50" y="670" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">客戶 C　持平</text><rect x="60" y="686" width="18.6" height="28" rx="5" fill="#a9a397"/><text x="92.57142857142857" y="709" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="60" y="724" width="18.6" height="28" rx="5" fill="#56645d"/><text x="92.57142857142857" y="748" font-size="26" fill="#56645d" font-weight="700" text-anchor="start">20</text><text x="50" y="840" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">客戶 D　小幅增購</text><rect x="60" y="856" width="18.6" height="28" rx="5" fill="#a9a397"/><text x="92.57142857142857" y="879" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="60" y="894" width="27.9" height="28" rx="5" fill="#265d50"/><text x="101.85714285714286" y="918" font-size="26" fill="#265d50" font-weight="700" text-anchor="start">30</text><text x="50" y="1010" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">客戶 E　大幅擴張</text><rect x="60" y="1026" width="18.6" height="28" rx="5" fill="#a9a397"/><text x="92.57142857142857" y="1049" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">20</text><rect x="60" y="1064" width="780.0" height="28" rx="5" fill="#265d50"/><text x="824.0" y="1087" font-size="26" fill="#f8f5ee" font-weight="700" text-anchor="end">840</text><line x1="50" y1="1170" x2="850" y2="1170" stroke="#e4dfd6" stroke-width="2"/><text x="50" y="1220" font-size="34" fill="#252b29" font-weight="700" text-anchor="start">合計 100 → 900</text><text x="50" y="1264" font-size="30" fill="#252b29" font-weight="700" text-anchor="start">NRR = 900 ÷ 100 = 900%</text><text x="50" y="1314" font-size="28" fill="#b65035" font-weight="700" text-anchor="start">但五家有一家流失、一家縮減；</text><text x="50" y="1352" font-size="28" fill="#b65035" font-weight="700" text-anchor="start">成長幾乎全來自客戶 E。</text><text x="50" y="1460" font-size="22" fill="#56645d" font-weight="400" text-anchor="start">定義依 S-1：合格客戶當期三個月收入 ÷</text><text x="50" y="1490" font-size="22" fill="#56645d" font-weight="400" text-anchor="start">一年前同季收入；排除 Claude Pro、Max</text><text x="50" y="1520" font-size="22" fill="#56645d" font-weight="400" text-anchor="start">固定價格訂閱者，新客戶不計入。</text></g></svg>