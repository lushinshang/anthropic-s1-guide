<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="title desc"><title id="title">三筆算力長約，付款期間重疊到 2033 年</title><desc id="desc">Microsoft、Google、Amazon 的最低付款期間與額外 TPU 估計交付期間在時間軸上的位置，各列金額不可相加。</desc><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="900" height="1600" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">三筆算力長約，</text><text x="50" y="134" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">付款期間重疊到 2033 年</text><text x="50" y="186" font-size="26" fill="#56645d" font-weight="400" text-anchor="start">本文依 S-1 MD&amp;A 整理；各列條件不同，不可相加</text><line x1="70.0" y1="300" x2="70.0" y2="1350" stroke="#e4dfd6" stroke-width="2"/><text x="70.0" y="286" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2026</text><line x1="208.2" y1="300" x2="208.2" y2="1350" stroke="#e4dfd6" stroke-width="2"/><text x="208.1818181818182" y="286" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2028</text><line x1="346.4" y1="300" x2="346.4" y2="1350" stroke="#e4dfd6" stroke-width="2"/><text x="346.3636363636364" y="286" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2030</text><line x1="484.5" y1="300" x2="484.5" y2="1350" stroke="#e4dfd6" stroke-width="2"/><text x="484.54545454545456" y="286" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2032</text><line x1="622.7" y1="300" x2="622.7" y2="1350" stroke="#e4dfd6" stroke-width="2"/><text x="622.7272727272727" y="286" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2034</text><line x1="760.9" y1="300" x2="760.9" y2="1350" stroke="#e4dfd6" stroke-width="2"/><text x="760.909090909091" y="286" font-size="24" fill="#56645d" font-weight="400" text-anchor="middle">2036</text><rect x="127.6" y="300" width="454.8" height="720" fill="#265d50" opacity="0.07"/><text x="50" y="338" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">Microsoft　2026/11–2033/5</text><rect x="127.6" y="360" width="454.8" height="64" rx="8" fill="#265d50"/><text x="50" y="468" font-size="32" fill="#265d50" font-weight="700" text-anchor="start">至少 449 億</text><text x="50" y="588" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">Google　2026/4–2033/7</text><rect x="87.3" y="610" width="506.7" height="64" rx="8" fill="#265d50"/><text x="50" y="718" font-size="32" fill="#265d50" font-weight="700" text-anchor="start">至少約 1,145 億</text><text x="50" y="838" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">Amazon　2026/5–2036/4</text><rect x="93.0" y="860" width="690.9" height="64" rx="8" fill="#265d50"/><text x="50" y="968" font-size="32" fill="#265d50" font-weight="700" text-anchor="start">至少 1,100 億</text><text x="50" y="1178" font-size="28" fill="#252b29" font-weight="700" text-anchor="start">額外 TPU　2028–2031 交付</text><rect x="208.2" y="1200" width="276.4" height="64" rx="8" fill="#fffdf9" stroke="#265d50" stroke-width="3" stroke-dasharray="10 8"/><text x="50" y="1308" font-size="32" fill="#265d50" font-weight="700" text-anchor="start">估計 1,250–1,500 億</text><text x="50" y="1060" font-size="24" fill="#265d50" font-weight="700" text-anchor="start">▲ 前三筆同時付款：2026/11–2033/5</text><text x="50" y="1440" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">虛線＝估計值（部署、容量與定價等條件而定），</text><text x="50" y="1474" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">與固定最低承諾性質不同。</text><text x="50" y="1520" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">來源：S-1 MD&amp;A 頁 170–171；不能再加到 6 月底</text><text x="50" y="1554" font-size="24" fill="#56645d" font-weight="400" text-anchor="start">附註 13 的約 2,656 億美元上。</text></g></svg>