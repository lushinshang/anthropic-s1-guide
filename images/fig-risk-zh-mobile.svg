<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="title desc"><title id="title">需求與多年付款，可能走不同速度</title><desc id="desc">當收入變動但多年最低付款未同步縮減，可能造成流動性壓力，並非必然違約。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#265d50"/></marker></defs><g font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><rect width="900" height="1600" rx="24" fill="#f8f5ee"/><text x="50" y="78" font-size="44" fill="#252b29" font-weight="700" text-anchor="start">需求與多年付款，可能走不同速度</text><text x="50" y="135" font-size="29" fill="#56645d" font-weight="400" text-anchor="start">本文分析｜條件式風險路徑；不是必然預測</text><rect x="65" y="210" width="770" height="205" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="90" y="259" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">需求或價格變動</text><text x="90" y="309" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">用量下降、模型降價或客戶轉移</text><path d="M450,425 L450,505" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="65" y="520" width="770" height="205" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="90" y="569" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">收入或收款承壓</text><text x="90" y="619" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">影響幅度仍受客群與通路條款左右</text><path d="M450,735 L450,815" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="65" y="830" width="770" height="205" rx="18" fill="#fffdf9" stroke="#265d50" stroke-width="2"/><text x="90" y="879" font-size="36" fill="#265d50" font-weight="700" text-anchor="start">多年付款未必同步縮減</text><text x="90" y="929" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">最低採購、租賃及部分部署付款仍可能存在</text><path d="M450,1045 L450,1125" fill="none" stroke="#265d50" stroke-width="4" marker-end="url(#arrow)"/><rect x="65" y="1140" width="770" height="205" rx="18" fill="#fffdf9" stroke="#b65035" stroke-width="2"/><text x="90" y="1189" font-size="36" fill="#b65035" font-weight="700" text-anchor="start">可能形成流動性壓力</text><text x="90" y="1239" font-size="30" fill="#252b29" font-weight="400" text-anchor="start">需看現金、到期結構、融資與調整能力</text><text x="55" y="1510" font-size="29" fill="#252b29" font-weight="400" text-anchor="start">不是把所有合約加總，就能得到近期支出。</text><text x="55" y="1555" font-size="26" fill="#56645d" font-weight="400" text-anchor="start">依 S-1 風險、流動性與承諾條款整理。</text></g></svg>